<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena 3D</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0f172a">
<link rel="canonical" href="https://fbiarabroblox-ai.github.io/Mygame/">
<noscript><meta http-equiv="refresh" content="1;url=https://fbiarabroblox-ai.github.io/Mygame/"></noscript>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 38%,#3a2208 0%,#14203a 38%,#0f172a 70%);
    color:#f1f5f9;font-family:"Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
    overflow:hidden;text-align:center;padding:20px
  }
  /* искры и монеты летят вверх */
  .p{position:absolute;bottom:-30px;border-radius:50%;background:#f59e0b;opacity:0;
     box-shadow:0 0 10px #f59e0b;animation:rise linear infinite}
  .p.coin{background:#facc15;border:2px solid #fde047;box-shadow:0 0 12px #f59e0b}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.1);opacity:0}}

  .stage{position:relative;width:min(62vw,240px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .ring{position:absolute;left:50%;bottom:2%;width:130%;height:34%;transform:translateX(-50%) rotateX(0);
     border:4px solid #fbbf24;border-radius:50%;box-shadow:0 0 24px #f59e0b,inset 0 0 24px #f59e0b88;
     animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 44px #f59e0b,inset 0 0 36px #f59e0baa;transform:translateX(-50%) scale(1.04)}}
  .orbit{position:absolute;left:50%;bottom:2%;width:130%;height:34%;transform:translateX(-50%);animation:spin 3.2s linear infinite}
  .orbit i{position:absolute;width:16px;height:16px;border-radius:50%;background:#facc15;border:2px solid #fde047;box-shadow:0 0 10px #f59e0b}
  .orbit i:nth-child(1){left:50%;top:-8px}.orbit i:nth-child(2){left:50%;bottom:-8px}
  .orbit i:nth-child(3){left:-8px;top:50%}.orbit i:nth-child(4){right:-8px;top:50%}
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
  .hero{position:relative;z-index:2;width:74%;aspect-ratio:1;border-radius:26px;object-fit:cover;
     box-shadow:0 10px 50px #f59e0b66;animation:float 2.2s ease-in-out infinite}
  .emoji{font-size:90px;position:relative;z-index:2;animation:float 2.2s ease-in-out infinite;display:none}
  @keyframes float{50%{transform:translateY(-14px) rotate(-2deg)}}

  h1{margin:6px 0 0;font-size:clamp(38px,9vw,64px);letter-spacing:2px;line-height:1;
     background:linear-gradient(180deg,#fde68a,#f59e0b 60%,#d97706);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 4px 0 #7c2d12)}
  .tag{color:#94a3b8;font-size:16px;margin:0}
  .bar{width:min(78vw,340px);height:16px;border-radius:99px;background:#1e293b;border:2px solid #334155;overflow:hidden}
  .bar b{display:block;height:100%;width:0;border-radius:99px;
     background:repeating-linear-gradient(45deg,#f59e0b 0 14px,#fbbf24 14px 28px);
     animation:load 2.8s cubic-bezier(.4,0,.2,1) forwards,stripes .6s linear infinite;background-size:40px 40px}
  @keyframes load{to{width:100%}}
  @keyframes stripes{to{background-position:40px 0}}
  #msg{margin:0;font-size:17px;color:#cbd5e1}
  a.go{display:inline-block;margin-top:4px;padding:12px 28px;border-radius:14px;background:#f59e0b;color:#1c1203;text-decoration:none;
     font-weight:700;font-size:20px;box-shadow:0 5px 0 #b45309;transition:transform .1s}
  a.go:active{transform:translateY(4px);box-shadow:0 1px 0 #b45309}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="ring"></div>
  <div class="orbit"><i></i><i></i><i></i><i></i></div>
  <img class="hero" src="icon.png" alt="Arena 3D" onerror="this.style.display='none';document.querySelector('.emoji').style.display='block'">
  <div class="emoji">👾</div>
</div>
<h1>ARENA 3D</h1>
<p class="tag" id="tag"></p>
<div class="bar"><b></b></div>
<p id="msg"></p>
<a class="go" id="go" href="https://fbiarabroblox-ai.github.io/Mygame/"></a>

<script>
  var TARGET="https://fbiarabroblox-ai.github.io/Mygame/"+location.search+location.hash;
  var L={
    ru:{tag:"Мультиплеерная игра в браузере",msg:"Загрузка арены…",go:"Играть сейчас"},
    en:{tag:"Browser multiplayer game",msg:"Loading the arena…",go:"Play now"},
    et:{tag:"Brauseri mitmikmäng",msg:"Arena laeb…",go:"Mängi kohe"}
  };
  var lg=(navigator.language||"ru").slice(0,2);var t=L[lg]||L.en;
  document.documentElement.lang=L[lg]?lg:"en";
  document.getElementById("tag").textContent=t.tag;
  document.getElementById("msg").textContent=t.msg;
  var go=document.getElementById("go");go.textContent=t.go;go.href=TARGET;

  // искры и монетки
  for(var i=0;i<22;i++){
    var s=document.createElement("span");s.className="p"+(i%4===0?" coin":"");
    var z=(i%4===0?14:4+Math.random()*6);
    s.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(4+Math.random()*5)+"s;animation-delay:"+(-Math.random()*6)+"s";
    document.body.appendChild(s);
  }
  setTimeout(function(){location.replace(TARGET)},2800);
</script>
</body>
</html>
