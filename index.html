<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena 3D // System Loading</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#030712">
<link rel="canonical" href="https://fbiarabroblox-ai.github.io/Mygame/">
<noscript><meta http-equiv="refresh" content="1;url=https://fbiarabroblox-ai.github.io/Mygame/"></noscript>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:#030712;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
      linear-gradient(to bottom, rgba(3, 7, 18, 0.9), rgba(3, 7, 18, 0.95));
    color:#e2e8f0;font-family:"Courier New", Courier, monospace, system-ui, sans-serif;
    overflow:hidden;text-align:center;padding:20px;position:relative;
  }

  /* Футуристическая сетка на фоне */
  body::before {
    content:"";position:absolute;inset:0;
    background-image: linear-gradient(rgba(6,182,212,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index:0;
    pointer-events:none;
  }

  /* Сканирующий луч */
  body::after {
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background: linear-gradient(90deg, transparent, #06b6d4, transparent);
    animation: scanline 3s linear infinite;
    z-index:1;
    pointer-events:none;
  }
  @keyframes scanline {
    0%{transform:translateY(-10px)}
    100%{transform:translateY(105vh)}
  }

  /* Цифровые частицы / искры */
  .p{position:absolute;bottom:-30px;background:#06b6d4;opacity:0;
     box-shadow:0 0 8px #06b6d4;animation:rise linear infinite}
  .p.coin{background:#38bdf8;border-radius:0;box-shadow:0 0 12px #38bdf8}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) scale(1);opacity:0}}

  .stage{position:relative;z-index:2;width:min(62vw,220px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  
  /* Голографический пьедестал */
  .ring{position:absolute;left:50%;bottom:5%;width:120%;height:30%;transform:translateX(-50%) rotateX(60deg);
     border:2px dashed #06b6d4;border-radius:50%;box-shadow:0 0 20px rgba(6,182,212,0.4),inset 0 0 20px rgba(6,182,212,0.2);
     animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 35px rgba(6,182,212,0.8),inset 0 0 30px rgba(6,182,212,0.5);border-color:#38bdf8}}
  
  .orbit{position:absolute;left:50%;bottom:5%;width:120%;height:30%;transform:translateX(-50%) rotateX(60deg);animation:spin 4s linear infinite}
  .orbit i{position:absolute;width:10px;height:10px;background:#38bdf8;box-shadow:0 0 10px #38bdf8}
  .orbit i:nth-child(1){left:50%;top:-5px}.orbit i:nth-child(2){left:50%;bottom:-5px}
  .orbit i:nth-child(3){left:-5px;top:50%}.orbit i:nth-child(4){right:-5px;top:50%}
  @keyframes spin{to{transform:translateX(-50%) rotateX(60deg) rotate(360deg)}}
  
  .hero{position:relative;z-index:3;width:70%;aspect-ratio:1;border-radius:12px;object-fit:cover;
     border:2px solid #06b6d4;box-shadow:0 0 30px rgba(6,182,212,0.5);animation:float 2.5s ease-in-out infinite}
  .emoji{font-size:80px;position:relative;z-index:3;animation:float 2.5s ease-in-out infinite;display:none;filter:drop-shadow(0 0 20px #06b6d4)}
  @keyframes float{50%{transform:translateY(-12px)}}

  .content-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}

  h1{margin:0;font-size:clamp(32px,8vw,56px);letter-spacing:4px;line-height:1;
     color:#f8fafc;text-shadow:0 0 10px rgba(6,182,212,0.8), 0 0 30px rgba(6,182,212,0.4), 0 0 50px rgba(6,182,212,0.2)}
  
  .tag{color:#38bdf8;font-size:14px;margin:0;letter-spacing:2px;text-transform:uppercase}

  /* Футуристический прогресс-бар */
  .bar-container{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(82vw,360px)}
  .bar-meta{display:flex;justify-content:space-between;width:100%;font-size:12px;color:#94a3b8;padding:0 2px;letter-spacing:1px}
  .bar-meta span:last-child{color:#06b6d4;font-weight:bold}
  
  .bar{width:100%;height:10px;border-radius:2px;background:#0f172a;border:1px solid #1e293b;overflow:hidden;position:relative;box-shadow:inset 0 0 8px rgba(0,0,0,0.8)}
  .bar b{display:block;height:100%;width:0;border-radius:1px;
     background:linear-gradient(90deg,#0284c7,#06b6d4,#38bdf8);
     box-shadow:0 0 12px #06b6d4;
     animation:load 2.8s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes load{to{width:100%}}

  #msg{margin:0;font-size:14px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="ring"></div>
  <div class="orbit"><i></i><i></i><i></i><i></i></div>
  <img class="hero" src="icon.png" alt="Arena 3D" onerror="this.style.display='none';document.querySelector('.emoji').style.display='block'">
  <div class="emoji">⚡</div>
</div>

<div class="content-wrap">
  <h1>ARENA 3D</h1>
  <p class="tag" id="tag"></p>
  
  <div class="bar-container">
    <div class="bar-meta">
      <span id="msg">INITIALIZING...</span>
      <span id="percent">0%</span>
    </div>
    <div class="bar"><b></b></div>
  </div>
</div>

<script>
  var TARGET="https://fbiarabroblox-ai.github.io/Mygame/"+location.search+location.hash;
  var L={
    ru:{tag:"// MULTIPLAYER COMBAT SYSTEM",msg:"Загрузка арены…"},
    en:{tag:"// MULTIPLAYER COMBAT SYSTEM",msg:"Loading arena…"},
    et:{tag:"// MULTIPLAYER COMBAT SYSTEM",msg:"Arena laeb…"}
  };
  var lg=(navigator.language||"ru").slice(0,2);var t=L[lg]||L.en;
  document.documentElement.lang=L[lg]?lg:"en";
  document.getElementById("tag").textContent=t.tag;
  document.getElementById("msg").textContent=t.msg;

  // Плавный счетчик процентов от 0 до 100 за 2.8 секунд
  var startTime = performance.now();
  var duration = 2800;
  var percentEl = document.getElementById("percent");

  function updateProgress(currentTime) {
    var elapsed = currentTime - startTime;
    var progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
    percentEl.textContent = progress + "%";
    if (progress < 100) {
      requestAnimationFrame(updateProgress);
    }
  }
  requestAnimationFrame(updateProgress);

  // Цифровые элементы / искры на фоне
  for(var i=0;i<20;i++){
    var s=document.createElement("span");s.className="p"+(i%3===0?" coin":"");
    var z=(i%3===0?4:2+Math.random()*4);
    s.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+(z*(i%3===0?4:1))+"px;animation-duration:"+(3+Math.random()*4)+"s;animation-delay:"+(-Math.random()*5)+"s";
    document.body.appendChild(s);
  }
  
  setTimeout(function(){location.replace(TARGET)},2800);
</script>
</body>
</html>
