<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena 3D - Loading...</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#030712">
<link rel="canonical" href="https://fbiarabroblox-ai.github.io/Mygame/">
<noscript><meta http-equiv="refresh" content="1;url=https://fbiarabroblox-ai.github.io/Mygame/"></noscript>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#030712;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 70%),
      linear-gradient(to bottom, rgba(3, 7, 18, 0.95), rgba(3, 7, 18, 0.99));
    color:#e2e8f0;font-family:"Courier New", Courier, monospace, system-ui, sans-serif;
    overflow:hidden;text-align:center;padding:20px;position:relative;
  }

  /* Фоновая сетка */
  body::before {
    content:"";position:absolute;inset:0;
    background-image: linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    z-index:0;
    pointer-events:none;
  }

  /* Сканирующий луч */
  body::after {
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background: linear-gradient(90deg, transparent, #06b6d4, transparent);
    animation: scanline 4s linear infinite;
    z-index:1;
    pointer-events:none;
  }
  @keyframes scanline {
    0%{transform:translateY(-10px)}
    100%{transform:translateY(105vh)}
  }

  /* Цифровые частицы */
  .p{position:absolute;bottom:-30px;background:#06b6d4;opacity:0;
     box-shadow:0 0 6px #06b6d4;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.6}100%{transform:translateY(-110vh) scale(1);opacity:0}}

  .stage{position:relative;z-index:2;width:min(50vw,160px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  
  .ring{position:absolute;left:50%;bottom:5%;width:120%;height:30%;transform:translateX(-50%) rotateX(60deg);
     border:2px dashed #06b6d4;border-radius:50%;box-shadow:0 0 15px rgba(6,182,212,0.3);
     animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 30px rgba(6,182,212,0.7);border-color:#38bdf8}}
  
  .hero{position:relative;z-index:3;width:70%;aspect-ratio:1;border-radius:10px;object-fit:cover;
     border:2px solid #06b6d4;box-shadow:0 0 25px rgba(6,182,212,0.4);animation:float 2.5s ease-in-out infinite}
  .emoji{font-size:64px;position:relative;z-index:3;animation:float 2.5s ease-in-out infinite;display:none;filter:drop-shadow(0 0 15px #06b6d4)}
  @keyframes float{50%{transform:translateY(-10px)}}

  .content-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}

  h1{margin:0;font-size:clamp(28px,7vw,46px);letter-spacing:3px;line-height:1;
     color:#f8fafc;text-shadow:0 0 10px rgba(6,182,212,0.8), 0 0 30px rgba(6,182,212,0.3)}
  
  .tag{color:#38bdf8;font-size:12px;margin:0 0 10px 0;letter-spacing:2px;text-transform:uppercase}

  /* Блок инициализации */
  .init-container{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    width:min(92vw,440px);min-height:90px;justify-content:center;
    padding:4px;position:relative;
  }

  /* Строки инициализации */
  .init-step {
    font-size: 15px;
    color: #475569;
    letter-spacing: 1.5px;
    text-transform: lowercase;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    transform: translateY(12px);
    display: none;
    align-items: center;
    gap: 10px;
  }

  /* Состояние: текущий активный шаг (крупный и яркий) */
  .init-step.active {
    display: flex;
    color: #38bdf8;
    opacity: 1;
    transform: translateY(0) scale(1.05);
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
  }

  /* Состояние: прошлый шаг (меньше и полупрозрачный под текущим) */
  .init-step.prev {
    display: flex;
    color: #94a3b8;
    opacity: 0.35;
    transform: translateY(-2px) scale(0.9);
    font-size: 12px;
  }

  /* Спиннер-точка */
  .spinner {
    width: 8px; height: 8px; border-radius: 50%; background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8; display: inline-block;
    animation: blink 0.8s infinite alternate;
  }
  @keyframes blink { from{opacity:0.2} to{opacity:1} }

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="ring"></div>
  <img class="hero" src="icon.png" alt="Arena 3D" onerror="this.style.display='none';document.querySelector('.emoji').style.display='block'">
  <div class="emoji">⚡</div>
</div>

<div class="content-wrap">
  <h1>ARENA 3D</h1>
  <p class="tag">// MULTIPLAYER COMBAT SYSTEM</p>
  
  <div class="init-container" id="initContainer"></div>
</div>

<script>
  var TARGET="https://fbiarabroblox-ai.github.io/Mygame/"+location.search+location.hash;

  // Время увеличено ровно в 3 раза по сравнению с прошлым вариантом
  var steps = [
    { text: "script initialization", duration: 1050 },
    { text: "engine initialization", duration: 2250 },
    { text: "map initialization", duration: 1350 },
    { text: "database initialization", duration: 1200 },
    { text: "auth initialization", duration: 900 },
    { text: "logging in", duration: 600 },
    { text: "reading account data", duration: 750 },
    { text: "app initialization", duration: 2700 }
  ];

  var container = document.getElementById("initContainer");
  var stepElements = [];

  steps.forEach(function(step) {
    var div = document.createElement("div");
    div.className = "init-step";
    div.innerHTML = '<span class="text">' + step.text + '</span>';
    container.appendChild(div);
    stepElements.push(div);
  });

  var currentStep = 0;

  function runStep() {
    // Сбрасываем старые классы у всех
    stepElements.forEach(function(el) {
      el.classList.remove("active", "prev");
      var sp = el.querySelector(".spinner");
      if (sp) sp.remove();
    });

    if (currentStep > 0) {
      // Показываем прошлый шаг
      var prevEl = stepElements[currentStep - 1];
      prevEl.classList.add("prev");
    }

    if (currentStep < steps.length) {
      // Показываем текущий активный шаг
      var el = stepElements[currentStep];
      el.classList.add("active");
      var spin = document.createElement("span");
      spin.className = "spinner";
      el.prepend(spin);

      var delay = steps[currentStep].duration;
      currentStep++;
      setTimeout(runStep, delay);
    } else {
      // Завершаем и перенаправляем
      setTimeout(function() {
        location.replace(TARGET);
      }, 500);
    }
  }

  setTimeout(runStep, 300);

  // Фоновые частицы
  for(var i=0;i<15;i++){
    var s=document.createElement("span");s.className="p";
    var z=2+Math.random()*3;
    s.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+(z*3)+"px;animation-duration:"+(3+Math.random()*3)+"s;animation-delay:"+(-Math.random()*4)+"s";
    document.body.appendChild(s);
  }
</script>
</body>
</html>
